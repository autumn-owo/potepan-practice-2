<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ストップウォッチアプリ</title>
    <link rel="stylesheet" href="css.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <h2>ストップウォッチ</h2>

    <!-- カウント -->
    <p>
        <span id="hour">0</span>:
        <span id="minute">0</span>:
        <span id="second">0</span>:
        <span id="mill">0</span>
    </p>
    <!-- ボタン -->
    <button id="time-start">スタート</button>
    <button id="time-stop" disabled>ストップ</button>
    <button id="time-reset" disabled>リセット</button>

    <script src="js.js"></script>
</body>

</html>
